services:
  aggregator:
    build:
      context: .
    image: ad-aggregator:latest
    volumes:
      - ${INPUT_DIR:-.}:/input:ro
      - ${OUTPUT_DIR:-./results}:/results
    command:
      - --input=/input/${INPUT_FILE:-ad_data.csv}
      - --output=/results/

  test:
    build:
      context: .
      target: tester
    image: ad-aggregator:test
    profiles:
      - test
