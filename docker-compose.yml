services:
  # ── Main job: process ad_data.csv ─────────────────────────────────────────
  aggregator:
    build:
      context: .
    image: ad-aggregator:latest
    volumes:
      - ./ad_data.csv:/data/ad_data.csv:ro   # mount CSV read-only
      - ./results:/results                    # write outputs here
    command:
      - --input=/data/ad_data.csv
      - --output=/results/
      - --workers=8
      - --batch=8000

  # ── Test runner: run go test inside Docker ────────────────────────────────
  test:
    build:
      context: .
      target: tester
    image: ad-aggregator:test
    profiles:
      - test   # only runs with: docker compose --profile test up test
